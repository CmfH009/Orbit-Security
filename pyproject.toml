[project]
name = "orbit-security"
version = "0.1.0"
description = "Autonomous external perimeter hygiene, subdomain takeover sentinel, and white-label client security auditing for web & Shopify agencies."
readme = "README.md"
authors = [
    { name = "CmfH009", email = "carsonmail009@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.8.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyautogui>=0.9.54",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pywinauto>=0.6.9",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
orbit-security = "orbit_security.cli:main"
agency-sentry = "orbit_security.cli:main"
orbit-recon = "orbit_security.cli:main_recon"


