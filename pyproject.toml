[project]
name = "orbit-security"
version = "0.1.0"
description = "Autonomous external perimeter hygiene, subdomain takeover sentinel, and white-label client security auditing for web & Shopify agencies."
readme = "README.md"
authors = [
    { name = "CmfH009", email = "carsonmail009@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dnspython>=2.8.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "reportlab>=5.0.1",
    "rich>=15.0.0",
    # Imported at module level by src/orbit_security/voice_model.py (edge-tts)
    # and src/orbit_security/desktop_x_bridge.py (Windows clipboard / focus).
    # Declared here so CI and `uv sync` install them without extra steps.
    "edge-tts>=7.0.0",
    "pillow>=11.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    # Runtime dependencies that were previously imported behind a try/except and
    # therefore silently degraded instead of failing loudly:
    #   psutil     -> core_affinity / network_bonding / social_daemon governor
    #                (without it the process silently loses CPU affinity and
    #                priority control)
    #   pyperclip  -> draft_manager clipboard staging
    "psutil>=5.9.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
# Stealth browser stack for the X driver. Kept optional because the package
# must install cleanly on a machine that does not drive a browser.
browser = [
    "patchright>=1.49.0",
    "rookiepy>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
orbit-security = "orbit_security.cli:main"
agency-sentry = "orbit_security.cli:main"
orbit-recon = "orbit_security.cli:main_recon"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "live: marks a test as a live/network integration test (deselect with -m 'not live')",
]


