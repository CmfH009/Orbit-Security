#cloud-config
# ==============================================================================
# Orbit Security: Oracle Cloud Always Free (ARM64 Ampere) Zero-Trust Cloud-Init
# ==============================================================================
# Target: Ubuntu 24.04 / 22.04 LTS (aarch64) - 4 OCPUs, 24 GB RAM
# Security Model: ZERO Public Ingress Ports (UFW Deny All, Tailscale Mesh Only)
# ==============================================================================

package_update: true
package_upgrade: true

packages:
  - ufw
  - curl
  - git
  - ca-certificates
  - unattended-upgrades
  - python3-venv
  - python3-pip

groups:
  - orbit: [orbit]

users:
  - default
  - name: orbit
    gecos: Orbit Security Service Account
    primary_group: orbit
    system: true
    shell: /bin/bash
    home: /home/orbit
    lock_passwd: true

write_files:
  # 1. Systemd hardened service unit for 24/7 background agent
  - path: /etc/systemd/system/orbit-security.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Orbit Security 24/7 Autonomous Threat Radar & Sentinel
      After=network.target tailscaled.service
      Wants=tailscaled.service

      [Service]
      Type=simple
      User=orbit
      Group=orbit
      WorkingDirectory=/opt/orbit-security
      EnvironmentFile=-/etc/default/orbit-security
      Environment=PYTHONUNBUFFERED=1
      Environment=PYTHONDONTWRITEBYTECODE=1
      Environment=PYTHONPATH=/opt/orbit-security/src
      Environment=ORBIT_WORKSPACE_ROOT=/opt/orbit-security
      ExecStart=/opt/orbit-security/.venv/bin/python src/orbit_security/bounty_rolling_daemon.py
      Restart=always
      RestartSec=10

      # Linux Kernel Hardening & Sandbox Directives
      ProtectSystem=strict
      ProtectHome=true
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      ProtectKernelModules=true
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
      RestrictRealtime=true
      CapabilityBoundingSet=
      LockPersonality=true
      ReadWritePaths=/opt/orbit-security/data /opt/orbit-security/logs

      [Install]
      WantedBy=multi-user.target

  # 2. Hardened systemd service unit for encrypted blackboard event shuttle to local cockpit
  - path: /etc/systemd/system/orbit-shuttle.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=Orbit Security Private Blackboard Event Shuttle to Cockpit
      After=network.target tailscaled.service orbit-security.service
      Wants=tailscaled.service

      [Service]
      Type=simple
      User=orbit
      Group=orbit
      WorkingDirectory=/opt/orbit-security
      EnvironmentFile=-/etc/default/orbit-security
      Environment=PYTHONUNBUFFERED=1
      Environment=PYTHONDONTWRITEBYTECODE=1
      Environment=PYTHONPATH=/opt/orbit-security/src
      Environment=ORBIT_WORKSPACE_ROOT=/opt/orbit-security
      ExecStart=/opt/orbit-security/.venv/bin/python -m orbit_security.event_shuttle --daemon
      Restart=always
      RestartSec=15

      # Linux Kernel Hardening & Sandbox Directives
      ProtectSystem=strict
      ProtectHome=true
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectKernelTunables=true
      ProtectControlGroups=true
      ProtectKernelModules=true
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
      RestrictRealtime=true
      CapabilityBoundingSet=
      LockPersonality=true
      ReadWritePaths=/opt/orbit-security/data /opt/orbit-security/logs

      [Install]
      WantedBy=multi-user.target

  # 3. Daily security auto-patching configuration
  - path: /etc/apt/apt.conf.d/50unattended-upgrades
    permissions: '0644'
    owner: root:root
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

runcmd:
  # 1. Disable conflicting Oracle default netfilter-persistent rules
  - systemctl stop netfilter-persistent || true
  - systemctl disable netfilter-persistent || true
  - iptables -F || true
  - iptables -X || true
  - iptables -t nat -F || true
  - iptables -t nat -X || true
  - iptables -P INPUT ACCEPT || true
  - iptables -P FORWARD ACCEPT || true
  - iptables -P OUTPUT ACCEPT || true

  # 2. Install Tailscale for Zero-Trust Private Mesh
  - curl -fsSL https://tailscale.com/install.sh | sh

  # 3. ZERO INGRESS FIREWALL: All public ports blocked, only Tailscale permitted
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow in on tailscale0
  - ufw allow 41641/udp comment "Tailscale WireGuard Direct P2P"
  - ufw --force enable

  # 4. Zero-touch First Boot: Connect to Tailnet if auth key is present
  - |
    if [ -n "${TAILSCALE_AUTHKEY:-}" ]; then
      tailscale up --authkey="${TAILSCALE_AUTHKEY}" --ssh --accept-routes
    fi

  # 3. Clone Orbit Security repository and configure isolated Python environment
  - mkdir -p /opt/orbit-security/data /opt/orbit-security/logs
  - git clone https://github.com/CmfH009/Orbit-Security.git /opt/orbit-security
  - python3 -m venv /opt/orbit-security/.venv
  - /opt/orbit-security/.venv/bin/pip install --upgrade pip
  - /opt/orbit-security/.venv/bin/pip install dnspython httpx pydantic psutil
  - /opt/orbit-security/.venv/bin/pip install -e /opt/orbit-security
  - chown -R orbit:orbit /opt/orbit-security

  # 4. Enable and start hardened background daemons
  - systemctl daemon-reload
  - systemctl enable orbit-security.service
  - systemctl enable orbit-shuttle.service
  # Note: Run 'tailscale up' with your auth key to connect the node to your private tailnet
