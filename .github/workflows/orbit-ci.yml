name: "Orbit Security CI"

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  tests:
    name: Tests
    # The runtime stack is Windows-native (pyautogui, pywinauto, pywin32 and the
    # Windows clipboard assertions in tests/test_desktop_x_bridge.py), so the
    # suite runs on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # PEP 735 dependency group `dev` (pytest / pytest-asyncio / pyyaml).
          # Older pip releases do not understand --group, hence the fallback.
          python -m pip install --group dev || python -m pip install "pytest>=9.1.1" "pytest-asyncio>=1.4.0" "pyyaml>=6.0.3"
          # Runtime imports exercised by the suite that are imported at module
          # level but are Windows/network specific:
          #   edge-tts -> src/orbit_security/voice_model.py
          #   pywin32  -> src/orbit_security/desktop_x_bridge.py (Windows clipboard)
          # Both are now declared in pyproject.toml; installed explicitly here
          # as belt-and-braces so CI never depends on the lock resolving them.
          python -m pip install edge-tts pywin32 pillow duckdb requests

      - name: Install ffmpeg
        shell: bash
        run: |
          # The video muxing and voice DSP paths shell out to ffmpeg. The
          # Windows runner image does not ship it, so the video, DSP and media
          # alternation tests would skip instead of running.
          choco install ffmpeg --no-progress -y --limit-output
          ffmpeg -version | head -n 1

      - name: Run pytest
        run: python -m pytest -q --junitxml=report/junit.xml

      - name: Upload JUnit report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: report/junit.xml

  parity:
    name: Landing / Docs Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check landing/ -> docs/ parity
        run: python scripts/sync_landing_to_docs.py --check

      - name: Run Radar Client Audit & Telemetry JS Parity Suite
        run: node tests/test_radar_parity_suite.js

      - name: AST Code Sentinel & CISA KEV PR Security Gate
        run: |
          python scripts/github_action_entrypoint.py \
            --target-path src/orbit_security \
            --scan-types ast,cisa-kev \
            --sarif-output orbit-security.sarif

  post-assets:
    name: Public Asset Availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: HEAD-check public URLs
        run: |
          python - <<'PY'
          import sys
          import urllib.error
          import urllib.request

          BASE = "https://cmfh009.github.io/Orbit-Security"

          # Blocking: every URL that the site declares and depends on must be
          # HTTP 200. These are now deployed, so a regression here is a real
          # regression, not a pending workstream.
          REQUIRED = [
              "/",
              "/about.html",
              "/fleet.html",
              "/signup.html",
              "/ghostdns/index.html",
              "/portals/index.html",
              "/robots.txt",
              "/sitemap.xml",
              "/assets/og-image.png",
              "/assets/logo.png",
              "/.well-known/security.txt",
          ]

          # Non-blocking: optional convenience files and cosmetic assets.
          # A failure here degrades convenience, not correctness.
          PENDING = [
              "/llms.txt",
              "/favicon.ico",
          ]

          def head(url):
              req = urllib.request.Request(
                  url, method="HEAD", headers={"User-Agent": "orbit-ci-parity"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return resp.status, ""
              except urllib.error.HTTPError as exc:
                  return exc.code, str(exc.reason)
              except Exception as exc:  # DNS / TLS / connection errors
                  return 0, str(exc)

          failures = []

          for path in REQUIRED:
              status, reason = head(BASE + path)
              ok = status == 200
              print(f"[{'PASS' if ok else 'FAIL'}] {BASE + path} -> {status} {reason}".rstrip())
              if not ok:
                  failures.append(path)

          for path in PENDING:
              status, reason = head(BASE + path)
              ok = status == 200
              print(f"[{'PASS' if ok else 'WARN'}] {BASE + path} -> {status} {reason}".rstrip())

          if failures:
              print(f"FAIL: {len(failures)} required URL(s) are not HTTP 200: {failures}")
              sys.exit(1)

          print("All required public URLs returned HTTP 200.")
          PY

  release:
    name: Ensure v1.1.0 GitHub Release
    needs: [tests, parity]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or Update v1.1.0 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view v1.1.0 >/dev/null 2>&1; then
            gh release create v1.1.0 \
              --title "Orbit Security v1.1.0 — SARIF 2.1.0 CI/CD Gate, Bounty Vault Compiler & Anti-Bounce Deliverability Gate" \
              --notes "### Shipped in Orbit Security v1.1.0
          - **Composite GitHub Action (\`CmfH009/Orbit-Security@v1\`) & SARIF 2.1.0 Exporter**: Static AST Code Sentinel, CISA KEV Dependency & PR Auditor, Static Secret Gate, and GitHub Code Scanning compliant SARIF 2.1.0 output (\`--sarif-output\`).
          - **Pre-KYC Bounty Remediation Vault Compiler (\`scripts/bounty_vault_generator.py\`)**: Deduplicates and consolidates passive reconnaissance findings into CWE/CVSS v3.1 disclosure dossiers.
          - **Anti-Bounce Contact Deliverability Gate (\`scripts/verify_contacts.py --preflight\`)**: De-obfuscates HTML entities and \`[at]\`/\`[dot]\` patterns, filters retina image filenames, and enforces a preflight deliverability threshold.
          - **Live GitHub Actions HEAD Reconciliation (\`scripts/daily_briefing.py\`)**: Reconciles historical CI alert emails against live workflow run conclusions on \`HEAD\`.
          - **1,250+ Deterministic Tests**: 100% passing across Python 3.13." \
              --verify-tag || true
          else
            echo "GitHub Release v1.1.0 already published."
          fi
