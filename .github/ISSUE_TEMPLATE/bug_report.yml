name: Bug Report
description: Report a bug in the Orbit Security CLI, composite GitHub Action, or web scanner.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Orbit Security Version / Commit SHA
      placeholder: "v1.1.0"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproduction Steps
      description: Exact CLI command or GitHub Action workflow snippet (use RFC 2606 example.com instead of real third-party domains).
    validations:
      required: true
