id: orbit-takeover-zendesk
info:
  name: Subdomain Takeover - Zendesk
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Zendesk where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the host mapping in DNS or update the Zendesk Guide custom domain
    setting.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - zendesk
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - zendesk.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - Help Center Closed
    condition: or
    part: body
  - type: status
    status:
    - 404
