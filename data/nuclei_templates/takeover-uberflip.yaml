id: orbit-takeover-uberflip
info:
  name: Subdomain Takeover - Uberflip
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Uberflip where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the Uberflip CNAME record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - uberflip
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - read.uberflip.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - The URL you've accessed does not provide a hub.
    condition: or
    part: body
  - type: status
    status:
    - 404
