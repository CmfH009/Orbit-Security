id: orbit-takeover-cargo-collective
info:
  name: Subdomain Takeover - Cargo Collective
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Cargo Collective
    where the remote resource is unallocated and subject to hostile takeover.
  remediation: Claim the Cargo Collective URL or delete the orphaned DNS record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - cargo-collective
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - cargocollective.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - 404 Not Found
    condition: or
    part: body
  - type: status
    status:
    - 404
