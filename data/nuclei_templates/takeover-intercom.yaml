id: orbit-takeover-intercom
info:
  name: Subdomain Takeover - Intercom
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Intercom where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Delete the Intercom CNAME or reconnect the Intercom Help Center.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - intercom
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - custom.intercom.help
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - Uh oh. That page doesn't exist
    - Intercom - Help Center Closed
    condition: or
    part: body
  - type: status
    status:
    - 404
