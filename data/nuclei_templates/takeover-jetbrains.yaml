id: orbit-takeover-jetbrains
info:
  name: Subdomain Takeover - JetBrains
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to JetBrains where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the JetBrains YouTrack CNAME record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - jetbrains
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - youtrack.cloud
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - is not a registered InCloud YouTrack
    condition: or
    part: body
  - type: status
    status:
    - 404
