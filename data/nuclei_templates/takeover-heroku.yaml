id: orbit-takeover-heroku
info:
  name: Subdomain Takeover - Heroku
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Heroku where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the Heroku CNAME record from DNS or provision the domain under
    an active Heroku application.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - heroku
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - herokudns.com
    - herokuapp.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - No such app
    - Heroku | No such app
    condition: or
    part: body
  - type: status
    status:
    - 404
