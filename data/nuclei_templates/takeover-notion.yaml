id: orbit-takeover-notion
info:
  name: Subdomain Takeover - Notion
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Notion where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the Notion CNAME record or configure Notion custom domain mapping.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - notion
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - notion.site
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - This page could not be found
    - "Notion \u2013 The all-in-one workspace"
    condition: or
    part: body
  - type: status
    status:
    - 404
