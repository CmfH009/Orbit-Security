id: orbit-takeover-surveysparrow
info:
  name: Subdomain Takeover - SurveySparrow
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to SurveySparrow where
    the remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the SurveySparrow CNAME record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - surveysparrow
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - surveysparrow.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - Account not found.
    condition: or
    part: body
  - type: status
    status:
    - 404
