id: orbit-takeover-cloudflare-pages
info:
  name: Subdomain Takeover - Cloudflare Pages
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Cloudflare Pages
    where the remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the CNAME or bind the custom domain in Cloudflare Pages project
    settings.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - cloudflare-pages
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - pages.dev
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - Page Not Found
    - The requested page could not be found
    condition: or
    part: body
  - type: status
    status:
    - 404
