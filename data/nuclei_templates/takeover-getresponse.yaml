id: orbit-takeover-getresponse
info:
  name: Subdomain Takeover - GetResponse
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to GetResponse where
    the remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the GetResponse CNAME record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - getresponse
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - .gr8.com
    - getresponse.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - With GetResponse Landing Pages, lead generation has never been easier
    condition: or
    part: body
  - type: status
    status:
    - 404
