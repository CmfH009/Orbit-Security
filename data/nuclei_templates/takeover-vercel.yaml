id: orbit-takeover-vercel
info:
  name: Subdomain Takeover - Vercel
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Vercel where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the dangling CNAME record or configure the domain in a verified
    Vercel project.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - vercel
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - cname.vercel-dns.com
    - vercel.app
    - vercel-dns.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - '404: NOT_FOUND'
    - The deployment could not be found
    condition: or
    part: body
  - type: status
    status:
    - 404
