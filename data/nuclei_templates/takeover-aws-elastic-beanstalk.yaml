id: orbit-takeover-aws-elastic-beanstalk
info:
  name: Subdomain Takeover - AWS Elastic Beanstalk
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to AWS Elastic Beanstalk
    where the remote resource is unallocated and subject to hostile takeover.
  remediation: Claim the matching Elastic Beanstalk environment prefix in your AWS
    region or remove the CNAME record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - aws-elastic-beanstalk
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - elasticbeanstalk.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - NXDOMAIN
    condition: or
    part: body
  - type: status
    status:
    - 404
