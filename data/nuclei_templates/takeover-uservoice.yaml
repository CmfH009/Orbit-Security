id: orbit-takeover-uservoice
info:
  name: Subdomain Takeover - UserVoice
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to UserVoice where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the UserVoice CNAME record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - uservoice
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - uservoice.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - This UserVoice instance is no longer active
    - This UserVoice subdomain is available
    condition: or
    part: body
  - type: status
    status:
    - 404
