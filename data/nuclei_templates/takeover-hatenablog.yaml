id: orbit-takeover-hatenablog
info:
  name: Subdomain Takeover - HatenaBlog
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to HatenaBlog where
    the remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the HatenaBlog CNAME record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - hatenablog
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - hatenablog.com
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - 404 Blog is not found
    condition: or
    part: body
  - type: status
    status:
    - 404
