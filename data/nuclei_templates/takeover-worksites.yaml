id: orbit-takeover-worksites
info:
  name: Subdomain Takeover - Worksites
  author: Orbit Security / rig-bounty-hunter
  severity: high
  description: Identifies dangling DNS CNAME records pointing to Worksites where the
    remote resource is unallocated and subject to hostile takeover.
  remediation: Remove the Worksites CNAME record.
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  - https://orbitsecurity.io/security.txt
  tags:
  - takeover
  - dns
  - subdomain
  - orbit-security
  - worksites
  metadata:
    verified: true
    max-request: 1
    cname-patterns:
    - worksites.net
http:
- method: GET
  path:
  - '{{BaseURL}}'
  matchers-condition: and
  matchers:
  - type: word
    words:
    - Hello! Sorry, but the website you're looking for doesn't exist.
    condition: or
    part: body
  - type: status
    status:
    - 404
